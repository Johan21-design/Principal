<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Ingreso - Master Finance</title>
    <link rel="stylesheet" href="Estilos/ingresos.css">
</head>
<body class="mf-body">
    <header class="mf-header">
        <div class="mf-header-left">
            <a href="página.principal.html" class="mf-brand">
                <img class="mf-logo" src="Estilos/logo_master_finance.png" alt="Logo Master Finance">
                <span class="mf-brand-title">Master Finance</span>
            </a>
            <span class="mf-page-badge">Formulario Ingresos</span>
        </div>

        <div class="mf-user-area">
            <div class="mf-user-info">
                <span>Nombre</span>
                <img src="Estilos/user-icon.png" alt="Usuario">
            </div>
            <ul class="mf-nav-links">
                <li><a href="página.principal.html">Inicio</a></li>
                <li><a href="ingresos.html">Ver Ingresos</a></li>
            </ul>
        </div>
    </header>

    <div class="mf-layout">
        <aside class="mf-sidebar">
            <ul>
                <li><a href="página.principal.html">Inicio</a></li>
                <li><a href="ingresos.html" class="active">Ingresos</a></li>
                <li><a href="gastos.html">Gastos</a></li>
                <li><a href="ahorros.html">Ahorros</a></li>
                <li><a href="metas.html">Metas</a></li>
                <li><a href="presupuesto.html">Presupuesto</a></li>
            </ul>
        </aside>

        <main class="mf-content">
            <div class="mf-top-bar">
                <h1>Nuevo Ingreso</h1>
                <a href="ingresos.html" class="mf-btn mf-btn-outline">← Volver a Ingresos</a>
            </div>

            <section class="mf-card">
                <h2>Datos del Ingreso</h2>
                <form action="php/guardar_ingreso.php" method="POST" class="mf-grid-2">
                    <div>
                        <div class="mf-form-group">
                            <label for="ingNombre">Nombre del ingreso *</label>
                            <input type="text" id="ingNombre" name="ingNombre" class="mf-input" placeholder="Ej: Salario" required>
                        </div>

                        <div class="mf-form-group">
                            <label for="ingMonto">Monto ($) *</label>
                            <input type="number" id="ingMonto" name="ingMonto" class="mf-input" placeholder="1750000" min="1" step="0.01" required>
                        </div>

                        <div class="mf-form-group">
                            <label for="ingFecha">Fecha *</label>
                            <input type="date" id="ingFecha" name="ingFecha" class="mf-input" required>
                        </div>
                    </div>

                    <div>
                        <div class="mf-form-group">
                            <label for="ingFrecuencia">Frecuencia *</label>
                            <select id="ingFrecuencia" name="ingFrecuencia" class="mf-select" required>
                                <option value="Mensual">Mensual</option>
                                <option value="Quincenal">Quincenal</option>
                                <option value="Semanal">Semanal</option>
                                <option value="Único">Único</option>
                            </select>
                        </div>

                        <div class="mf-form-group">
                            <label for="ingRecordatorio">¿Desea recordatorio?</label>
                            <select id="ingRecordatorio" name="ingRecordatorio" class="mf-select">
                                <option value="si">Sí</option>
                                <option value="no">No</option>
                            </select>
                        </div>

                        <div class="mf-form-group">
                            <label for="ingDescripcion">Descripción</label>
                            <textarea id="ingDescripcion" name="ingDescripcion" rows="2" class="mf-textarea" placeholder="Detalle opcional..."></textarea>
                        </div>

                        <button type="submit" class="mf-btn mf-btn-primary mf-btn-full">Guardar Ingreso</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
