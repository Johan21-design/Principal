
<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Finance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #000;
    color: #fff;
}

/* ENCABEZADO */
header {
    width: 100%;
    min-height: 85px;
    background: #000;
    display: flex;
    align-items: center;
    padding: 10px 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    gap: 12px;
}

.logo {
    width: 55px;
    height: 55px;
    object-fit: contain;
}

.logo-nombre {
    color: white;
    font-size: 23px;
    font-weight: bold;
    text-decoration: none;
    white-space: nowrap;
}

.logo-nombre span {
    color: #ed1c24;
}

/* BARRA DE NAVEGACIÓN */
nav {
    background: #111;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    padding: 12px 15px;
    gap: 10px;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 15px;
    transition: .3s;
}

nav a:hover {
    background: #ed1c24;
}

/* CONTENIDO PRINCIPAL */
main {
    min-height: calc(100vh - 140px);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
}

.bienvenida {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.bienvenida img {
    width: 300px;
    max-width: 80%;
    height: auto;
    margin-bottom: 25px;
    border-radius: 15px;
}

.bienvenida h2 {
    font-size: 32px;
    color: #fff;
    margin-bottom: 15px;
}

.bienvenida h2 span {
    color: #ed1c24;
}

.bienvenida p {
    font-size: 18px;
    color: #ccc;
    margin-bottom: 30px;
}

/* BOTONES */
.botones a {
    display: block;
    width: 220px;
    padding: 14px;
    margin: 10px auto;
    background: #ed1c24;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: .3s;
}

.botones a:hover {
    background: #a90008;
    transform: translateY(-3px);
}

/* DISEÑO PARA CELULARES */
@media(max-width:768px) {
    header {
        justify-content: center;
        padding: 12px;
    }

    .logo {
        width: 45px;
        height: 45px;
    }

    .logo-nombre {
        font-size: 19px;
    }

    nav {
        gap: 5px;
    }

    nav a {
        padding: 10px 12px;
        font-size: 13px;
    }

    .bienvenida h2 {
        font-size: 25px;
    }

    .bienvenida img {
        width: 230px;
    }
}
</style>
</head>
