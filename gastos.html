<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos - Master Finance</title>
    <link rel="stylesheet" href="Estilos/gastos.css">
</head>
<body class="mf-body">
    <header class="mf-header">
        <div class="mf-header-left">
            <a href="pag.principal.html" class="mf-brand">
                <img class="mf-logo" src="Estilos/logo_master_finance.png" alt="Logo Master Finance">
                <span class="mf-brand-title">Master Finance</span>
            </a>
            <span class="mf-page-badge">Gastos</span>
        </div>

        <div class="mf-user-area">
            <div class="mf-user-info">
                <span>Nombre</span>
                <img src="Estilos/user-icon.png" alt="Usuario">
            </div>
            <ul class="mf-nav-links">
                <li><a href="perfil.html">Perfil</a></li>
                <li><a href="index.html">Cerrar Sesión</a></li>
            </ul>
        </div>
    </header>

    <div class="mf-layout">
        <aside class="mf-sidebar">
            <ul>
                <li><a href="pag.principal.html">Inicio</a></li>
                <li><a href="ingresos.html">Ingresos</a></li>
                <li><a href="gastos.html" class="active">Gastos</a></li>
                <li><a href="ahorros.html">Ahorros</a></li>
                <li><a href="metas.html">Metas</a></li>
                <li><a href="presupuesto.html">Presupuesto</a></li>
            </ul>
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(239, 68, 68, 0.25);">
                <a href="pag.principal.html" class="mf-btn mf-btn-outline mf-btn-full">← Página Principal</a>
            </div>
        </aside>

        <main class="mf-content">
            <div class="mf-top-bar">
                <div class="mf-title-group">
                    <h1>Gastos</h1>
                    <button type="button" class="mf-btn mf-btn-outline">↑↓ Organizar</button>
                </div>
                <a href="#registrar-gasto" class="mf-btn mf-btn-primary">+ Agregar gastos</a>
            </div>

            <section class="mf-grid-2">
                <article class="mf-card mf-card-prioritario">
                    <div class="mf-card-header">
                        <h2>Pago de Servicios</h2>
                        <span class="mf-tag-prioritario">★ Gasto prioritario</span>
                    </div>

                    <div class="mf-form-group">
                        <label>Total Pagado</label>
                        <input type="text" class="mf-input" value="$ Total Pagos" readonly>
                    </div>

                    <div class="mf-actions-row">
                        <button type="button" class="mf-btn mf-btn-primary">Ver Servicios</button>
                        <button type="button" class="mf-btn mf-btn-danger">Eliminar</button>
                    </div>
                </article>

                <article class="mf-card mf-card-varios">
                    <div class="mf-card-header">
                        <h2>Gastos Varios</h2>
                        <span class="mf-tag-muted">Extras</span>
                    </div>

                    <div class="mf-form-group">
                        <label>Total Pagado</label>
                        <input type="text" class="mf-input" value="Suma de todos los extra" readonly>
                    </div>

                    <div class="mf-actions-row">
                        <button type="button" class="mf-btn mf-btn-outline">Ver Gastos Varios</button>
                    </div>
                </article>
            </section>

            <section id="registrar-gasto" class="mf-card">
                <h2>Registrar Nuevo Gasto</h2>
                <form action="php/guardar_gasto.php" method="POST" class="mf-grid-2">
                    <div>
                        <div class="mf-form-group">
                            <label for="gasNombre">Nombre del gasto *</label>
                            <input type="text" id="gasNombre" name="gasNombre" class="mf-input" placeholder="Ej: Internet" required>
                        </div>

                        <div class="mf-form-group">
                            <label for="gasCategoria">Categoría *</label>
                            <select id="gasCategoria" name="gasCategoria" class="mf-select" required>
                                <option value="Servicios">Servicios (Gasto prioritario)</option>
                                <option value="Alimentación">Alimentación</option>
                                <option value="Transporte">Transporte</option>
                                <option value="Entretenimiento">Entretenimiento</option>
                                <option value="Varios">Gastos Varios</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <div class="mf-form-group">
                            <label for="gasMonto">Monto ($) *</label>
                            <input type="number" id="gasMonto" name="gasMonto" class="mf-input" placeholder="50000" min="1" required>
                        </div>

                        <div class="mf-form-group">
                            <label for="gasFecha">Fecha *</label>
                            <input type="date" id="gasFecha" name="gasFecha" class="mf-input" required>
                        </div>

                        <button type="submit" class="mf-btn mf-btn-primary mf-btn-full">Guardar Gasto</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
