<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis gastos | Master Finance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: #fff;
        }

        header {
            width: 90%;
            max-width: 1100px;
            min-height: 200px;
            margin: 0 auto;
            padding: 24px 7%;
            background: #111;
            border: 2px solid #1d1d1d;
            border-bottom: none;
            border-radius: 55px 55px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .marca {
            font-size: clamp(25px, 5vw, 60px);
            font-weight: bold;
            white-space: nowrap;
        }

        .marca span {
            color: #ed1c24;
        }

        .inicio {
            display: inline-block;
            background: #ed1c24;
            color: #fff;
            text-decoration: none;
            font-size: clamp(20px, 3.5vw, 42px);
            padding: 30px 55px;
            border-radius: 15px;
            text-align: center;
        }

        .inicio:hover, button:hover {
            background: #c9151c;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .total, .formulario {
            background: #151515;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        .total {
            border-left: 5px solid #ed1c24;
        }

        .total h2 {
            color: #ed1c24;
            margin-bottom: 10px;
        }

        .total p {
            font-size: 30px;
            font-weight: bold;
        }

        .formulario h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #ed1c24;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            background: #111;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            header {
                min-height: 125px;
                padding: 18px 5%;
                border-radius: 30px 30px 0 0;
            }

            .marca {
                white-space: normal;
                font-size: clamp(20px, 5vw, 30px);
            }

            .inicio {
                padding: 15px 20px;
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="marca">
            MASTER <span>FINANCE</span>
        </div>

        <a class="inicio" href="pag.principal.html">Inicio</a>
    </header>

    <main class="contenedor">

        <h1>Mis gastos</h1>

        <section class="total">
            <h2>Total de gastos</h2>
            <p id="total">$0</p>
        </section>

        <section class="formulario">

            <h2>Agregar gasto</h2>

            <form id="formGasto">

                <label for="cantidad">Cantidad</label>

                <input
                    type="number"
                    id="cantidad"
                    placeholder="Ingresa la cantidad"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="categoria">Categoría del gasto</label>

                <select id="categoria" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="Alimentación">Alimentación</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Vivienda">Vivienda</option>
                    <option value="Servicios">Servicios</option>
                    <option value="Salud">Salud</option>
                    <option value="Educación">Educación</option>
                    <option value="Entretenimiento">Entretenimiento</option>
                    <option value="Otros">Otros</option>
                </select>

                <button type="submit">Agregar gasto</button>

            </form>

        </section>

    </main>

    <footer>
        Organiza, ahorra, crece y alcanza tus metas.
        <br><br>
        © 2026 Master Finance
    </footer>

    <script>
        let totalGastos = 0;

        const formulario = document.getElementById("formGasto");
        const cantidad = document.getElementById("cantidad");
        const categoria = document.getElementById("categoria");
        const total = document.getElementById("total");

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const valor = Number(cantidad.value);

            if (!Number.isFinite(valor) || valor <= 0 || !categoria.value) {
                alert("Ingresa una cantidad válida y selecciona una categoría.");
                return;
            }

            totalGastos += valor;

            total.textContent =
                "$" + totalGastos.toLocaleString("es-CO");

            formulario.reset();

        });
    </script>

</body>
</html>
