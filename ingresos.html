<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis ingresos | Master Finance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: white;
        }

        header {
            background: #111;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #ed1c24;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .total {
            background: #151515;
            border-left: 5px solid #ed1c24;
            padding: 25px;
            margin-bottom: 25px;
        }

        .total h2 {
            color: #ed1c24;
            margin-bottom: 10px;
        }

        .total p {
            font-size: 30px;
            font-weight: bold;
        }

        .formulario, .historial {
            background: #151515;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #ed1c24;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #c9151c;
        }

        .historial p {
            color: #aaa;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            background: #111;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <img src="Estilos/logo_master_finance.png" alt="Master Finance">
        <a href="pag.principal.html">Inicio</a>
    </header>

    <main class="contenedor">

        <h1>Mis ingresos</h1>

        <section class="total">
            <h2>Total de ingresos</h2>
            <p>$0</p>
        </section>

        <section class="formulario">
            <h2>Registrar ingreso</h2>

            <form action="#" method="post">

                <label for="cantidad">Cantidad</label>
                <input
                    type="number"
                    id="cantidad"
                    name="cantidad"
                    placeholder="Ingresa la cantidad"
                    min="1"
                    step="0.01"
                    required
                >

                <label for="tipo">Tipo de ingreso</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="Salario">Salario</option>
                    <option value="Ingreso extra">Ingreso extra</option>
                </select>

                <button type="submit">Agregar ingreso</button>

            </form>
        </section>

        <section class="historial">
            <h2>Historial de ingresos</h2>
            <p>Todavía no tienes ingresos registrados.</p>
        </section>

    </main>

    <footer>
        Organiza, ahorra, crece y alcanza tus metas.
        <br><br>
        © 2026 Master Finance
    </footer>

</body>
</html>
