<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Master Finance</title>

    <style>
        /* ESTILOS GENERALES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        /* ENCABEZADO */
        header {
            width: 100%;
            height: 85px;
            background-color: #000;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        .logo-nombre {
            color: white;
            font-size: 23px;
            font-weight: bold;
            text-decoration: none;
            margin-left: 12px;
        }

        .logo-nombre span {
            color: #ed1c24;
        }

        /* USUARIO */
        .user-icon {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
            cursor: pointer;
        }

        .user-icon p {
            font-size: 15px;
            font-weight: bold;
            color: white;
        }

        .user-icon img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* SUBMENÚ */
        .sub-menu {
            display: none;
            position: absolute;
            right: 25px;
            top: 75px;
            background-color: #222;
            width: 160px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            z-index: 10;
        }

        .user-icon:hover + .sub-menu,
        .sub-menu:hover {
            display: block;
        }

        .sub-menu ul {
            list-style: none;
        }

        .sub-menu a {
            display: block;
            padding: 12px;
            text-decoration: none;
            color: white;
        }

        .sub-menu a:hover {
            background-color: #ed1c24;
        }

        /* CONTENIDO PRINCIPAL */
        main {
            display: flex;
            min-height: calc(100vh - 85px);
        }

        /* MENÚ LATERAL */
        .menu {
            width: 230px;
            background-color: #111;
            padding: 25px 15px;
        }

        .menu ul {
            list-style: none;
        }

        .menu li {
            margin-bottom: 12px;
        }

        .menu li a {
            display: block;
            padding: 13px 15px;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            transition: 0.3s;
        }

        .menu li a:hover {
            background-color: #ed1c24;
            padding-left: 22px;
        }

        /* TOTAL RESTANTE */
        .menu label {
            display: block;
            color: white;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        .menu input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ed1c24;
            border-radius: 6px;
            background-color: #222;
            color: white;
            font-weight: bold;
        }

        /* BIENVENIDA */
        .bienvenida {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .bienvenida img {
            width: 300px;
            max-width: 80%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 25px;
            object-fit: contain;
        }

        .bienvenida h2 {
            font-size: 32px;
            color: #111;
            margin-bottom: 15px;
        }

        .bienvenida h2 span {
            color: #ed1c24;
        }

        .bienvenida p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        /* BOTONES */
        .bienvenida a {
            display: inline-block;
            width: 220px;
            padding: 14px;
            margin: 8px;
            background-color: #ed1c24;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .bienvenida a:hover {
            background-color: #a90008;
            transform: translateY(-3px);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header {
                padding: 0 12px;
            }

            .logo {
                width: 50px;
                height: 50px;
            }

            .logo-nombre {
                font-size: 18px;
            }

            .user-icon p {
                font-size: 11px;
            }

            main {
                flex-direction: column;
            }

            .menu {
                width: 100%;
            }

            .menu ul {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            .menu li {
                margin: 4px;
            }

            .menu input {
                width: 150px;
            }

            .bienvenida {
                padding: 35px 15px;
            }

            .bienvenida h2 {
                font-size: 25px;
            }

            .bienvenida img {
                width: 250px;
            }
        }
    </style>
</head>

<body>

    <!-- ENCABEZADO -->
    <header>

        <a href="index.html">
            <img class="logo"
                 src="Estilos/logo_master_finance.png"
                 alt="Logo Master Finance">
        </a>

        <a href="index.html" class="logo-nombre">
            MASTER <span>FINANCE</span>
        </a>

        <!-- USUARIO -->
        <div class="user-icon">
            <p>Bienvenido, Usuario</p>

            <img src="Estilos/user-icon.png"
                 alt="Icono de usuario">
        </div>

        <!-- SUBMENÚ -->
        <div class="sub-menu">
            <ul>
                <li>
                    <a href="perfil.html">Perfil</a>
                </li>

                <li>
                    <a href="index.html">Cerrar Sesión</a>
                </li>
            </ul>
        </div>

    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- MENÚ LATERAL -->
        <div class="menu">

            <ul>

                <li>
                    <a href="ingresos.html">Ingresos</a>
                </li>

                <li>
                    <a href="gastos.html">Gastos</a>
                </li>

                <li>
                    <a href="ahorros.html">Ahorros</a>
                </li>

                <li>
                    <a href="metas.html">Metas</a>
                </li>

                <li>
                    <a href="presupuesto.html">Presupuesto</a>
                </li>

                <li>
                    <a href="#">Reportes</a>
                </li>

                <li>
                    <label for="total-restante">
                        Total restante:
                    </label>

                    <input
                        type="text"
                        id="total-restante"
                        name="total-restante"
                        value="$0.00"
                        readonly>
                </li>

            </ul>

        </div>

        <!-- SECCIÓN DE BIENVENIDA -->
        <section class="bienvenida">

            <img
                src="Estilos/logo_master_finance.png"
                alt="Logo Master Finance">

            <h2>
                Bienvenido a <span>Master Finance</span>
            </h2>

            <p>
                ¿Por dónde quieres empezar hoy?
            </p>

            <a href="ingresos.html">
                Registra tus ingresos
            </a>

            <a href="gastos.html">
                Registra tus gastos
            </a>

        </section>

    </main>

</body>

</html>
