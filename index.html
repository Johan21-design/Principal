
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Master Finance</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        :root {
            --azul: #0878d1;
            --azul-oscuro: #002d62;
        }

        body {
            background: #080808;
            color: white;
        }

        /* ENCABEZADO */

        header {
            width: 100%;
            min-height: 85px;
            padding: 12px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #000;
            border-bottom: 1px solid #252525;
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .logo-nombre {
            font-size: 22px;
            font-weight: bold;
            color: white;
        }

        .logo-nombre span {
            color: var(--azul);
        }

        /* BOTONES */

        .acciones {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: .3s;
        }

        .btn-login {
            color: white;
            border: 1px solid #555;
        }

        .btn-login:hover {
            border-color: var(--azul);
            color: var(--azul);
        }

        .btn-registro {
            color: white;
            background: var(--azul);
        }

        .btn-registro:hover {
            background: var(--azul-oscuro);
            transform: translateY(-3px);
        }

        /* PRESENTACIÓN PRINCIPAL */

        .hero {
            min-height: calc(100vh - 155px);
            padding: 80px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;

            background:
                radial-gradient(
                    circle at 80% 50%,
                    #102d50 0%,
                    #101820 30%,
                    #080808 70%
                );
        }

        .hero-texto {
            max-width: 600px;
        }

        .etiqueta {
            display: inline-block;
            padding: 9px 16px;
            border: 1px solid #164c7c;
            border-radius: 30px;
            color: #55b5ff;
            background: #0b1c2e;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 55px;
            line-height: 1.15;
            margin-bottom: 32px;
        }

        .hero h1 span {
            color: var(--azul);
        }

        /* BOTÓN PRINCIPAL */

        .btn-principal {
            display: inline-block;
            padding: 16px 28px;
            color: white;
            background: var(--azul);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: .3s;
        }

        .btn-principal:hover {
            background: var(--azul-oscuro);
            transform: translateY(-3px);
        }

        /* IMAGEN */

        .hero-imagen {
            width: 42%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-imagen img {
            width: 100%;
            max-width: 390px;
            border-radius: 25px;
            filter: drop-shadow(0 0 35px #0878d130);
            object-fit: contain;
        }

        /* PIE DE PÁGINA */

        footer {
            width: 100%;
            padding: 30px 15px;
            background: #000;
            border-top: 2px solid var(--azul);
            text-align: center;
        }

        footer p {
            color: #999;
            font-size: 14px;
            margin: 8px 0;
        }

        /* TABLETS */

        @media (max-width: 900px) {

            header {
                padding: 15px 4%;
            }

            .hero {
                padding: 70px 6%;
            }

            .hero h1 {
                font-size: 42px;
            }
        }

        /* CELULARES */

        @media (max-width: 600px) {

            header {
                min-height: 75px;
                padding: 10px 4%;
            }

            .logo {
                width: 43px;
                height: 43px;
            }

            .logo-nombre {
                font-size: 15px;
            }

            .acciones {
                gap: 7px;
            }

            .btn {
                padding: 9px 10px;
                font-size: 11px;
            }

            .hero {
                min-height: calc(100vh - 135px);
                flex-direction: column;
                justify-content: center;
                text-align: center;
                padding: 65px 22px;
                gap: 40px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero-imagen {
                width: 85%;
            }

            .hero-imagen img {
                max-width: 280px;
            }

            footer {
                padding: 25px 12px;
            }

            footer p {
                font-size: 13px;
            }
        }

    </style>

</head>

<body>

    <!-- ENCABEZADO -->

    <header>

        <a href="index.html" class="marca">

            <img
                class="logo"
                src="Estilos/logo_master_finance.png"
                alt="Logo Master Finance"
            >

            <div class="logo-nombre">
                MASTER <span>FINANCE</span>
            </div>

        </a>

        <!-- BOTONES DE USUARIO -->

        <div class="acciones">

            <a href="login.html" class="btn btn-login">
                Iniciar sesión
            </a>

            <a href="registro.html" class="btn btn-registro">
                Regístrate
            </a>

        </div>

    </header>

    <!-- PRESENTACIÓN -->

    <main>

        <section class="hero">

            <div class="hero-texto">

                <span class="etiqueta">
                    TU FUTURO FINANCIERO COMIENZA AQUÍ
                </span>

                <h1>
                    Toma el control de tus
                    <span>finanzas personales</span>
                </h1>

                <a href="login.html" class="btn-principal">
                    Comenzar ahora →
                </a>

            </div>

            <div class="hero-imagen">

                <img
                    src="Estilos/logo_master_finance.png"
                    alt="Logo Master Finance"
                >

            </div>

        </section>

    </main>

    <!-- PIE DE PÁGINA -->

    <footer>

        <p>Organiza, ahorra, crece y alcanza tus metas.</p>

        <p>© 2026 Master Finance. Todos los derechos reservados.</p>

    </footer>

</body>
</html>
