<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Master Finance - Iniciar sesión</title>

 <style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 font-family: Arial, sans-serif;
 }

 body {
 background: #080808;
 color: white;
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 }

 header {
 padding: 20px 8%;
 display: flex;
 align-items: center;
 justify-content: space-between;
 }

 .logo {
 display: flex;
 align-items: center;
 gap: 10px;
 }

 .logo img {
 width: 45px;
 height: 45px;
 object-fit: contain;
 }

 .logo h2 {
 font-size: 20px;
 }

 .logo span {
 color: #ed1c24;
 }

 header a {
 color: white;
 text-decoration: none;
 }

 main {
 flex: 1;
 display: flex;
 justify-content: center;
 align-items: center;
 padding: 30px 20px;
 }

 .login {
 width: 350px;
 max-width: 100%;
 text-align: center;
 }

 .login img {
 width: 85px;
 height: 85px;
 object-fit: contain;
 margin-bottom: 20px;
 }

 .login h1 {
 font-size: 28px;
 margin-bottom: 10px;
 }

 .login p {
 color: #aaa;
 margin-bottom: 30px;
 }

 input {
 width: 100%;
 padding: 14px;
 margin-bottom: 18px;
 border: 1px solid #444;
 border-radius: 6px;
 background: #171717;
 color: white;
 outline: none;
 }

 input:focus {
 border-color: #ed1c24;
 }

 button {
 width: 100%;
 padding: 14px;
 background: #ed1c24;
 color: white;
 border: none;
 border-radius: 6px;
 font-size: 16px;
 cursor: pointer;
 }

 button:hover {
 background: #bd1018;
 }

 .registro {
 margin-top: 25px;
 font-size: 14px;
 }

 .registro a {
 color: #ed1c24;
 text-decoration: none;
 }

 footer {
 text-align: center;
 padding: 20px;
 color: #888;
 font-size: 13px;
 }
 </style>
</head>

<body>

 <header>
 <div class="logo">
 <img src="Estilos/img/logo-master-finance.jpeg" alt="Logo">
 <h2>MASTER <span>FINANCE</span></h2>
 </div>

 <a href="index.html">Inicio</a>
 </header>

 <main>
 <form class="login" onsubmit="iniciarSesion(event)">
 <img src="Estilos/img/logo-master-finance.jpeg" alt="Logo Master Finance">

 <h1>Iniciar sesión</h1>
 <p>Bienvenido a Master Finance</p>

 <input type="email" id="correo" placeholder="Correo electrónico" required>

 <input type="password" id="contrasena" placeholder="Contraseña" required>

 <button type="submit">Ingresar</button>

 <div class="registro">
 ¿No tienes cuenta?
 <a href="registro.html">Regístrate</a>
 </div>
 </form>
 </main>

 <footer>
 Organiza, ahorra, crece y alcanza tus metas.<br>
 © 2026
 </footer>

 <script>
 function iniciarSesion(event) {
 event.preventDefault();
 window.location.href = "pag.principal.html";
 }
 </script>

</body>
</html>
